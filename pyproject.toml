[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "logic-agent"
dynamic = ["version"]
description = "A hardware-agnostic MCP gateway that lets AI agents capture and analyze logic-analyzer signals"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
logic-agent = "logic_agent.cli:main"
logic-agent-mcp = "logic_agent.mcp_server:main"

[tool.setuptools.dynamic]
version = { attr = "logic_agent.__version__" }

[tool.setuptools.packages.find]
include = ["logic_agent*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

